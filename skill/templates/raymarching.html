<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="motion-system" content="raymarching">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ceramic ring</title>
<!-- Loop method: a seeded signed-distance ring and drop blend rotate and breathe
     with integer-frequency sine/cosine uniforms. Each phase is shaded independently.
     Query: ?seed=N (default 1), ?t=seconds (default 14), ?p=0..1 for a still.
     Optional palette: ?bg=RRGGBB&ink=RRGGBB&accent=RRGGBB. Space pauses playback. -->
<style>
  :root { --bg: #e6e1d7; --ink: #393e3a; --accent: #bc7458; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="A matte ceramic ring gently turning under soft light"></canvas>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const parsedSeed = Number.parseInt(q.get('seed') ?? '1', 10);
  const seed = Number.isFinite(parsedSeed) ? parsedSeed >>> 0 : 1;
  const parsedDuration = Number.parseFloat(q.get('t') ?? '14');
  const DURATION = Number.isFinite(parsedDuration) && parsedDuration > 0 ? parsedDuration : 14;
  for (const k of ['bg', 'ink', 'accent'])
    if (/^(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(q.get(k) ?? ''))
      document.documentElement.style.setProperty('--' + k, '#' + q.get(k));
  function mulberry32(a) {
    return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  const rng = mulberry32(seed);
  const traits = [rng(), rng(), rng(), rng()];
  const cv = document.getElementById('c');
  const css = name => getComputedStyle(cv).getPropertyValue(name).trim();
  const swatch = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
  swatch.canvas.width = swatch.canvas.height = 1;
  function color(name) {
    swatch.clearRect(0, 0, 1, 1); swatch.fillStyle = '#000';
    swatch.fillStyle = css(name); swatch.fillRect(0, 0, 1, 1);
    return Array.from(swatch.getImageData(0, 0, 1, 1).data).slice(0, 3).map(v => v / 255);
  }

  const gl = cv.getContext('webgl', { alpha: false, antialias: false, preserveDrawingBuffer: true });
  let program, uniforms;
  if (gl) {
    const vertex = `attribute vec2 position;
      void main() { gl_Position = vec4(position, 0.0, 1.0); }`;
    const fragment = `precision highp float;
      uniform vec2 resolution;
      uniform vec4 traits;
      uniform vec3 background, ink, accent;
      uniform float phase;
      const float TURN = radians(360.0);
      mat2 rotate(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
      float blend(float a, float b, float k) {
        float h = max(k - abs(a - b), 0.0) / k;
        return min(a, b) - h * h * k * 0.25;
      }
      float field(vec3 p) {
        float t = phase * TURN;
        p.xy = rotate((traits.z - 0.5) * 0.65 + 0.11 * sin(t)) * p.xy;
        p.xz = rotate((traits.w - 0.5) * 0.8 + 0.36 * sin(t + traits.x * TURN)) * p.xz;
        p.yz = rotate(0.13 * cos(t)) * p.yz;
        p.y /= 1.0 + traits.y * 0.19;
        float a = atan(p.y, p.x);
        float radius = 0.80 + traits.x * 0.08;
        float thickness = 0.23 + traits.y * 0.05 + 0.028 * cos(a * 2.0 + t);
        float ring = length(vec2(length(p.xy) - radius, p.z)) - thickness;
        vec3 drop = p - vec3(0.30 + traits.z * 0.12, -0.61, 0.04);
        drop.y *= 0.88;
        float mass = length(drop) - (0.36 + traits.w * 0.09);
        // Conservative step for the mild non-uniform scale and smooth blend.
        return blend(ring, mass, 0.30) * 0.78;
      }
      vec3 normal(vec3 p) {
        const vec2 e = vec2(0.0015, 0.0);
        return normalize(vec3(field(p + e.xyy) - field(p - e.xyy),
          field(p + e.yxy) - field(p - e.yxy), field(p + e.yyx) - field(p - e.yyx)));
      }
      void main() {
        vec2 uv = (gl_FragCoord.xy * 2.0 - resolution) / min(resolution.x, resolution.y);
        vec3 ro = vec3(0.0, 0.02, 4.8);
        vec3 rd = normalize(vec3(uv, -2.95));
        float paper = 0.99 - 0.026 * length(uv * vec2(0.55, 0.7));
        vec3 col = background * paper;
        // One broad cast shadow anchors the sculpture on the seamless ground.
        float shadow = exp(-pow(uv.x / 0.63, 2.0) - pow((uv.y + 0.89) / 0.095, 2.0));
        col = mix(col, ink, shadow * 0.14);
        // Clip tracing to a containing sphere; the empty background costs no steps.
        float b = dot(ro, rd), c = dot(ro, ro) - 2.25;
        float discriminant = b * b - c;
        if (discriminant > 0.0) {
          float root = sqrt(discriminant);
          float travel = max(0.0, -b - root), end = -b + root;
          float distance = 1.0;
          for (int i = 0; i < 64; i++) {
            distance = field(ro + rd * travel);
            if (distance < 0.0012 || travel > end) break;
            travel += distance;
          }
          if (distance < 0.0012 && travel <= end) {
            vec3 p = ro + rd * travel;
            vec3 n = normal(p);
            vec3 light = normalize(vec3(-0.6, 0.85, 1.1));
            float diffuse = max(0.0, dot(n, light));
            float cavity = clamp(field(p + n * 0.14) / 0.105, 0.3, 1.0);
            float broad = pow(max(0.0, dot(n, normalize(light - rd))), 12.0);
            float facing = max(0.0, dot(n, -rd));
            vec3 clay = mix(accent, background, 0.12 + traits.z * 0.24);
            col = clay * (0.57 + 0.40 * diffuse) * (0.82 + 0.18 * cavity);
            col += background * (broad * 0.18 + pow(1.0 - facing, 3.0) * 0.05);
          }
        }
        gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
      }`;
    function shader(type, source) {
      const s = gl.createShader(type); gl.shaderSource(s, source); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error('Unable to compile the sculpture shader');
      return s;
    }
    program = gl.createProgram();
    gl.attachShader(program, shader(gl.VERTEX_SHADER, vertex));
    gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fragment));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error('Unable to link the sculpture shader');
    gl.useProgram(program);
    const buffer = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const position = gl.getAttribLocation(program, 'position'); gl.enableVertexAttribArray(position);
    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
    uniforms = Object.fromEntries(['resolution', 'traits', 'background', 'ink', 'accent', 'phase']
      .map(name => [name, gl.getUniformLocation(program, name)]));
    gl.uniform4fv(uniforms.traits, traits);
  }
  const ctx = gl ? null : cv.getContext('2d');
  let cpuFrame;
  function resize() {
    // Bound tracing to 1280x720 pixels on the GPU and 320x180 on the CPU.
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const budget = gl ? 921600 : 57600;
    const scale = Math.min(dpr, Math.sqrt(budget / Math.max(1, cv.clientWidth * cv.clientHeight)));
    cv.width = Math.max(1, Math.round(cv.clientWidth * scale));
    cv.height = Math.max(1, Math.round(cv.clientHeight * scale));
    if (gl) gl.viewport(0, 0, cv.width, cv.height);
    else cpuFrame = ctx.createImageData(cv.width, cv.height);
  }
  function drawCPU(p) {
    // The same distance field, camera, marching limits and lighting as the shader.
    const t = p * Math.PI * 2;
    const xy = (traits[2] - 0.5) * 0.65 + 0.11 * Math.sin(t);
    const xz = (traits[3] - 0.5) * 0.8 + 0.36 * Math.sin(t + traits[0] * Math.PI * 2);
    const yz = 0.13 * Math.cos(t);
    const cxy = Math.cos(xy), sxy = Math.sin(xy), cxz = Math.cos(xz), sxz = Math.sin(xz);
    const cyz = Math.cos(yz), syz = Math.sin(yz);
    function field(x, y, z) {
      // GLSL mat2 constructors are column-major.
      [x, y] = [cxy * x + sxy * y, -sxy * x + cxy * y];
      [x, z] = [cxz * x + sxz * z, -sxz * x + cxz * z];
      [y, z] = [cyz * y + syz * z, -syz * y + cyz * z];
      y /= 1 + traits[1] * 0.19;
      const radius = 0.80 + traits[0] * 0.08;
      const thickness = 0.23 + traits[1] * 0.05 + 0.028 * Math.cos(Math.atan2(y, x) * 2 + t);
      const ring = Math.hypot(Math.hypot(x, y) - radius, z) - thickness;
      const mass = Math.hypot(x - (0.30 + traits[2] * 0.12), (y + 0.61) * 0.88, z - 0.04)
        - (0.36 + traits[3] * 0.09);
      const h = Math.max(0.30 - Math.abs(ring - mass), 0) / 0.30;
      return (Math.min(ring, mass) - h * h * 0.30 * 0.25) * 0.78;
    }
    const background = color('--bg'), ink = color('--ink'), accent = color('--accent');
    const mix = 0.12 + traits[2] * 0.24;
    const clay = accent.map((v, i) => v * (1 - mix) + background[i] * mix);
    const lightLength = Math.hypot(-0.6, 0.85, 1.1);
    const lx = -0.6 / lightLength, ly = 0.85 / lightLength, lz = 1.1 / lightLength;
    const width = cv.width, height = cv.height, size = Math.min(width, height);
    const data = cpuFrame.data;
    for (let row = 0; row < height; row++) {
      for (let column = 0; column < width; column++) {
        const u = (2 * column + 1 - width) / size, v = (height - 2 * row - 1) / size;
        const length = Math.hypot(u, v, -2.95);
        const dx = u / length, dy = v / length, dz = -2.95 / length;
        const paper = 0.99 - 0.026 * Math.hypot(u * 0.55, v * 0.7);
        const shadow = Math.exp(-Math.pow(u / 0.63, 2) - Math.pow((v + 0.89) / 0.095, 2)) * 0.14;
        let shade = 0, highlight = 0, hit = false;
        const b = 0.02 * dy + 4.8 * dz, c = 0.02 * 0.02 + 4.8 * 4.8 - 2.25;
        const discriminant = b * b - c;
        if (discriminant > 0) {
          const root = Math.sqrt(discriminant), end = -b + root;
          let travel = Math.max(0, -b - root), distance = 1;
          for (let step = 0; step < 64; step++) {
            distance = field(dx * travel, 0.02 + dy * travel, 4.8 + dz * travel);
            if (distance < 0.0012 || travel > end) break;
            travel += distance;
          }
          if (distance < 0.0012 && travel <= end) {
            hit = true;
            const x = dx * travel, y = 0.02 + dy * travel, z = 4.8 + dz * travel, e = 0.0015;
            let nx = field(x + e, y, z) - field(x - e, y, z);
            let ny = field(x, y + e, z) - field(x, y - e, z);
            let nz = field(x, y, z + e) - field(x, y, z - e);
            const normalLength = Math.hypot(nx, ny, nz);
            nx /= normalLength; ny /= normalLength; nz /= normalLength;
            const diffuse = Math.max(0, nx * lx + ny * ly + nz * lz);
            const cavity = Math.max(0.3, Math.min(1, field(x + nx * 0.14, y + ny * 0.14, z + nz * 0.14) / 0.105));
            const halfLength = Math.hypot(lx - dx, ly - dy, lz - dz);
            const broad = Math.pow(Math.max(0, (nx * (lx - dx) + ny * (ly - dy) + nz * (lz - dz)) / halfLength), 12);
            const facing = Math.max(0, -(nx * dx + ny * dy + nz * dz));
            shade = (0.57 + 0.40 * diffuse) * (0.82 + 0.18 * cavity);
            highlight = broad * 0.18 + Math.pow(1 - facing, 3) * 0.05;
          }
        }
        const index = (row * width + column) * 4;
        for (let channel = 0; channel < 3; channel++) {
          const value = hit ? clay[channel] * shade + background[channel] * highlight
            : background[channel] * paper * (1 - shadow) + ink[channel] * shadow;
          data[index + channel] = Math.round(Math.max(0, Math.min(1, value)) * 255);
        }
        data[index + 3] = 255;
      }
    }
    ctx.putImageData(cpuFrame, 0, 0);
  }
  function draw(p) {
    if (gl) {
      gl.uniform2f(uniforms.resolution, cv.width, cv.height);
      gl.uniform1f(uniforms.phase, p);
      gl.uniform3fv(uniforms.background, color('--bg'));
      gl.uniform3fv(uniforms.ink, color('--ink'));
      gl.uniform3fv(uniforms.accent, color('--accent'));
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      return;
    }
    drawCPU(p);
  }

  const normalize = p => ((p % 1) + 1) % 1;
  const requestedPhase = Number.parseFloat(q.get('p') ?? '0');
  let phase = Number.isFinite(requestedPhase) ? normalize(requestedPhase) : 0;
  let frozen = q.has('p'), frameId = null, last = null;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  window.__info = { seed, duration: DURATION, frames: 0 };
  function stop() {
    if (frameId !== null) cancelAnimationFrame(frameId);
    frameId = null; last = null;
  }
  window.renderFrame = (i, total) => {
    if (!Number.isFinite(i) || !Number.isInteger(total) || total < 1)
      throw new RangeError('renderFrame needs a finite frame index and a positive integer total');
    stop(); frozen = true; phase = normalize(i / total); draw(phase);
  };
  function tick(now) {
    frameId = null;
    if (reduced.matches || frozen) return;
    const dt = last === null ? 0 : Math.min((now - last) / 1000, 0.1);
    last = now;
    if (!document.hidden) {
      phase = normalize(phase + dt / DURATION); draw(phase); window.__info.frames++;
    }
    frameId = requestAnimationFrame(tick);
  }
  function start() {
    if (!reduced.matches && !frozen && frameId === null) frameId = requestAnimationFrame(tick);
  }
  resize(); draw(phase);
  addEventListener('resize', () => { resize(); draw(phase); });
  reduced.addEventListener('change', () => { stop(); draw(phase); start(); });
  addEventListener('keydown', event => {
    if (event.code !== 'Space' || q.has('p') || reduced.matches) return;
    event.preventDefault(); frozen = !frozen; stop(); start();
  });
  if (reduced.matches || q.has('p')) return;
  start();
})();
</script>
</body>
</html>
