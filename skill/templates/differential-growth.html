<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="motion-system" content="differential-growth">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Differential growth</title>
<!-- Loop recipe: grow a seeded contour with repulsion and edge subdivision for
     1500 fixed steps, then freeze its topology. A smooth periodic displacement
     is smaller than the stored contour's minimum non-neighbor gap.
     Query: ?seed=N, ?p=0..1 for a still, ?t=seconds (default 16).
     Optional palette: ?bg=RRGGBB&ink=RRGGBB&accent=RRGGBB. Space pauses. -->
<style>
  :root { --bg: #eee9dd; --ink: #41493d; --accent: #ad6645; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="A fine folded cord gently breathing inside an oval on warm paper"></canvas>
<script>
(() => {
  const TAU = Math.PI * 2;
  const q = new URLSearchParams(location.search);
  const parsedSeed = Number.parseInt(q.get('seed') ?? '1', 10);
  const seed = Number.isFinite(parsedSeed) ? parsedSeed >>> 0 : 1;
  const parsedDuration = Number.parseFloat(q.get('t') ?? '16');
  const DURATION = Number.isFinite(parsedDuration) && parsedDuration > 0 ? parsedDuration : 16;
  for (const name of ['bg', 'ink', 'accent'])
    if (/^(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(q.get(name) ?? ''))
      document.documentElement.style.setProperty('--' + name, '#' + q.get(name));
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  function mulberry32(a) {
    return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  const rng = mulberry32(seed);
  const RX = 490, RY = 300, CELL = 18, COLS = 58, ROWS = 37, LIMIT = 2400;
  const offset = rng() * TAU, bend = rng() * TAU, tilt = (rng() - 0.5) * 0.12;
  let nodes = Array.from({ length: 100 }, (_, i) => {
    const a = i / 100 * TAU;
    const r = 1 + 0.26 * Math.cos(3 * a + offset) + 0.12 * Math.sin(5 * a + bend);
    return { x: Math.cos(a) * 265 * r, y: Math.sin(a) * 165 * r, g: 0.8 + rng() * 0.4, length: 0 };
  });
  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i], b = nodes[(i + 1) % nodes.length];
    a.length = Math.hypot(a.x - b.x, a.y - b.y);
  }
  const heads = new Int32Array(COLS * ROWS), links = new Int32Array(LIMIT);
  const moveX = new Float64Array(LIMIT), moveY = new Float64Array(LIMIT);
  const cellX = x => Math.max(0, Math.min(COLS - 1, Math.floor((x + 522) / CELL)));
  const cellY = y => Math.max(0, Math.min(ROWS - 1, Math.floor((y + 333) / CELL)));
  // A spatial grid keeps the one-time warm-up local, independent of viewport size.
  for (let step = 0; step < 1500; step++) {
    const n = nodes.length;
    heads.fill(-1);
    for (let i = 0; i < n; i++) {
      const bucket = cellY(nodes[i].y) * COLS + cellX(nodes[i].x);
      links[i] = heads[bucket]; heads[bucket] = i;
    }
    for (let i = 0; i < n; i++) {
      const p = nodes[i], prev = nodes[(i + n - 1) % n], next = nodes[(i + 1) % n];
      let fx = ((prev.x + next.x) * 0.5 - p.x) * 0.08;
      let fy = ((prev.y + next.y) * 0.5 - p.y) * 0.08;
      const dx0 = prev.x - p.x, dy0 = prev.y - p.y, distance0 = Math.hypot(dx0, dy0);
      const dx1 = next.x - p.x, dy1 = next.y - p.y, distance1 = Math.hypot(dx1, dy1);
      const spring0 = (distance0 - prev.length) * 0.35 / Math.max(0.001, distance0);
      const spring1 = (distance1 - p.length) * 0.35 / Math.max(0.001, distance1);
      fx += dx0 * spring0 + dx1 * spring1;
      fy += dy0 * spring0 + dy1 * spring1;
      const gx = cellX(p.x), gy = cellY(p.y), radius = 15;
      for (let cy = Math.max(0, gy - 1); cy <= Math.min(ROWS - 1, gy + 1); cy++)
        for (let cx = Math.max(0, gx - 1); cx <= Math.min(COLS - 1, gx + 1); cx++)
          for (let j = heads[cy * COLS + cx]; j !== -1; j = links[j]) {
            if (Math.min(Math.abs(i - j), n - Math.abs(i - j)) <= 2) continue;
            const dx = p.x - nodes[j].x, dy = p.y - nodes[j].y, d2 = dx * dx + dy * dy;
            if (d2 > 0.000001 && d2 < radius * radius) {
              const d = Math.sqrt(d2), force = 1.8 * (1 - d / radius) / d;
              fx += dx * force; fy += dy * force;
            }
          }
      const radial = Math.hypot(p.x / RX, p.y / RY);
      if (radial > 0.97) {
        const strength = (radial - 0.97) * 12;
        fx -= p.x / RX * strength; fy -= p.y / RY * strength;
      }
      const speed = Math.hypot(fx, fy), cap = speed > 0.7 ? 0.7 / speed : 1;
      moveX[i] = fx * cap; moveY[i] = fy * cap;
    }
    for (let i = 0; i < n; i++) {
      const p = nodes[i]; p.x += moveX[i]; p.y += moveY[i];
      if (step < 1300 && n < LIMIT) p.length *= 1 + 0.0018 * p.g;
      const radial = Math.hypot(p.x / RX, p.y / RY);
      if (radial > 0.99) { p.x *= 0.99 / radial; p.y *= 0.99 / radial; }
    }
    if (step < 1300 && step % 5 === 0 && n < LIMIT) {
      const grown = [];
      for (let i = 0; i < n; i++) {
        const a = nodes[i], b = nodes[(i + 1) % n];
        grown.push(a);
        if (a.length > 9 && Math.hypot(b.x - a.x, b.y - a.y) > 6 && grown.length + n - i < LIMIT) {
          a.length *= 0.5;
          grown.push({ x: (a.x + b.x) * 0.5, y: (a.y + b.y) * 0.5, g: (a.g + b.g) * 0.5, length: a.length });
        }
      }
      nodes = grown;
    }
  }
  // Freeze the polyline. Measure non-local separation before choosing motion.
  let gap = 20;
  for (let i = 0; i < nodes.length; i++)
    for (let j = i + 4; j < nodes.length; j++) {
      if (nodes.length - (j - i) < 4) continue;
      gap = Math.min(gap, Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y));
    }
  const amplitude = Math.min(1.6, gap * 0.09);
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const points = new Float64Array(nodes.length * 2);
  let scale = 1;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(cv.clientWidth * dpr));
    cv.height = Math.max(1, Math.round(cv.clientHeight * dpr));
    scale = Math.min(cv.width / 1100, cv.height / 700);
  }
  function trace() {
    const n = nodes.length;
    ctx.beginPath();
    ctx.moveTo((points[0] + points[(n - 1) * 2]) * 0.5, (points[1] + points[(n - 1) * 2 + 1]) * 0.5);
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      ctx.quadraticCurveTo(points[i * 2], points[i * 2 + 1],
        (points[i * 2] + points[j * 2]) * 0.5, (points[i * 2 + 1] + points[j * 2 + 1]) * 0.5);
    }
    ctx.closePath();
  }
  function draw(p) {
    const th = p * TAU, sn = Math.sin(th), cs = Math.cos(th);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = css('--bg'); ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.translate(cv.width / 2, cv.height / 2); ctx.scale(scale, scale); ctx.rotate(tilt);
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      points[i * 2] = a.x + amplitude * (sn * Math.sin(a.y * 0.006 + offset) + cs * 0.3);
      points[i * 2 + 1] = a.y + amplitude * (cs * Math.sin(a.x * 0.005 + bend) + sn * 0.3);
    }
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // One continuous fine cord keeps the folded contour clear and inexpensive.
    trace(); ctx.strokeStyle = css('--ink'); ctx.globalAlpha = 0.9; ctx.lineWidth = 2; ctx.stroke();
    // A single mineral-colored passage follows the same unbroken cord.
    ctx.beginPath();
    const first = Math.floor(nodes.length * 0.13), last = Math.floor(nodes.length * 0.21);
    ctx.moveTo((points[(first - 1) * 2] + points[first * 2]) * 0.5,
      (points[(first - 1) * 2 + 1] + points[first * 2 + 1]) * 0.5);
    for (let i = first; i < last; i++)
      ctx.quadraticCurveTo(points[i * 2], points[i * 2 + 1],
        (points[i * 2] + points[(i + 1) * 2]) * 0.5, (points[i * 2 + 1] + points[(i + 1) * 2 + 1]) * 0.5);
    ctx.strokeStyle = css('--accent'); ctx.globalAlpha = 1; ctx.stroke();
    ctx.globalAlpha = 1;
  }
  const normalize = p => ((p % 1) + 1) % 1;
  const requestedPhase = Number.parseFloat(q.get('p') ?? '0');
  let phase = Number.isFinite(requestedPhase) ? normalize(requestedPhase) : 0;
  let exported = false;
  let frozen = q.has('p'), frameId = null, last = null;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  window.__info = { seed, duration: DURATION, frames: 0 };
  function stop() {
    if (frameId !== null) cancelAnimationFrame(frameId);
    frameId = null; last = null;
  }
  window.renderFrame = (i, total) => {
    if (!Number.isFinite(i) || !Number.isInteger(total) || total < 1)
      throw new RangeError('renderFrame needs a finite frame index and a positive integer total');
    stop(); exported = true; frozen = true; phase = normalize(i / total); draw(phase);
  };
  function tick(now) {
    frameId = null;
    if (reduced.matches || frozen || document.hidden) return;
    const dt = last === null ? 0 : Math.min((now - last) / 1000, 0.1);
    last = now;
    if (!document.hidden) { phase = normalize(phase + dt / DURATION); draw(phase); window.__info.frames++; }
    frameId = requestAnimationFrame(tick);
  }
  function start() {
    if (!document.hidden && !reduced.matches && !frozen && frameId === null) frameId = requestAnimationFrame(tick);
  }
  document.addEventListener('visibilitychange', () => { stop(); if (!document.hidden) { draw(phase); start(); } });
  resize(); draw(phase);
  addEventListener('resize', () => { resize(); if (!document.hidden) draw(phase); });
  reduced.addEventListener('change', () => { stop(); if (!document.hidden) draw(phase); start(); });
  addEventListener('keydown', event => {
    if (event.code !== 'Space' || event.repeat || exported || q.has('p') || reduced.matches) return;
    event.preventDefault(); frozen = !frozen; stop(); start();
  });
  if (reduced.matches || q.has('p')) return;
  start();
})();
</script>
</body>
</html>
