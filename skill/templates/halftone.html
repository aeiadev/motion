<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="motion-system" content="halftone">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halftone</title>
<!-- Loop: a light follows a closed phase circle over a seeded analytic torus.
     The 45-degree screen and surface stay fixed; only dot radii change.
     Query: ?seed=N, ?p=0..1 for a still, ?t=seconds (default 16).
     Optional palette: ?bg=RRGGBB&ink=RRGGBB&accent=RRGGBB. Space pauses. -->
<style>
  :root { --bg: #f1e9db; --ink: #283e3c; --accent: #ad694f; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="An ink halftone sculpture shaded by a slowly orbiting light"></canvas>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const parsedSeed = Number.parseInt(q.get('seed') ?? '1', 10);
  const seed = Number.isFinite(parsedSeed) ? parsedSeed >>> 0 : 1;
  const parsedDuration = Number.parseFloat(q.get('t') ?? '16');
  const DURATION = Number.isFinite(parsedDuration) && parsedDuration > 0 ? parsedDuration : 16;
  for (const key of ['bg', 'ink', 'accent'])
    if (/^(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(q.get(key) ?? ''))
      document.documentElement.style.setProperty('--' + key, '#' + q.get(key));
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const css = name => getComputedStyle(cv).getPropertyValue(name).trim();
  function mulberry32(a) {
    return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  const rng = mulberry32(seed), TAU = Math.PI * 2;
  const tilt = (rng() - 0.5) * 0.85, ca = Math.cos(tilt), sa = Math.sin(tilt);
  const squash = 0.73 + rng() * 0.13, stretch = 1.18 + rng() * 0.12;
  const offset = rng() * TAU, lightOffset = rng() * TAU;
  const tube = 0.135 + rng() * 0.025, major = 0.285;
  let width = 1, height = 1, dpr = 1, spacing = 1, dots = [];
  const smooth = t => { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); };

  function resize() {
    width = Math.max(1, cv.clientWidth); height = Math.max(1, cv.clientHeight);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(width * dpr); cv.height = Math.round(height * dpr);
    // Fit the complete sculpture in either a landscape or portrait viewport.
    const size = Math.min(height * 1.16, width / 1.36);
    spacing = Math.max(3, size / 92);
    const step = spacing / Math.SQRT2;
    const extent = Math.ceil((width + height) / (2 * step)) + 2;
    dots = [];
    for (let u = -extent; u <= extent; u++) {
      for (let v = -extent; v <= extent; v++) {
        const x = width / 2 + (u + v) * step;
        const y = height / 2 + (u - v) * step;
        if (x < -spacing || y < -spacing || x > width + spacing || y > height + spacing) continue;
        const dx = (x - width / 2) / size, dy = (y - height / 2) / size;
        const px = (dx * ca + dy * sa) / stretch;
        const py = (-dx * sa + dy * ca) / squash;
        const angle = Math.atan2(py, px), distance = Math.hypot(px, py);
        const localTube = tube * (1 + 0.095 * Math.cos(3 * angle + offset));
        const radial = (distance - major) / localTube;
        if (Math.abs(radial) >= 1) continue;
        const nz = Math.sqrt(1 - radial * radial);
        const nx = radial * Math.cos(angle), ny = radial * Math.sin(angle);
        dots.push({ x, y, nx: nx * ca - ny * sa, ny: nx * sa + ny * ca, nz,
          edge: smooth((1 - Math.abs(radial)) * size * localTube / spacing),
          cavity: smooth(-radial) * 0.14 });
      }
    }
  }

  function draw(p) {
    const theta = p * TAU + lightOffset;
    const lx = Math.cos(theta) * 0.63, ly = Math.sin(theta) * 0.45 - 0.24, lz = 0.76;
    const norm = Math.hypot(lx, ly, lz);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = css('--bg'); ctx.fillRect(0, 0, width, height);
    ctx.fillStyle = css('--ink');
    ctx.beginPath();
    for (const dot of dots) {
      const light = Math.max(0, (dot.nx * lx + dot.ny * ly + dot.nz * lz) / norm);
      const density = Math.min(0.96, 0.13 + 0.76 * Math.pow(1 - light, 0.8) + dot.cavity);
      const radius = spacing * 0.49 * Math.sqrt(density * dot.edge);
      ctx.moveTo(dot.x + radius, dot.y);
      ctx.arc(dot.x, dot.y, radius, 0, TAU);
    }
    ctx.fill();
  }

  const normalize = p => ((p % 1) + 1) % 1;
  const requestedPhase = Number.parseFloat(q.get('p') ?? '0');
  let phase = Number.isFinite(requestedPhase) ? normalize(requestedPhase) : 0;
  let frozen = q.has('p'), frameId = null, last = null;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  window.__info = { seed, duration: DURATION, frames: 0 };

  function stop() {
    if (frameId !== null) cancelAnimationFrame(frameId);
    frameId = null;
    last = null;
  }
  // Rendering an export frame stops playback, including if called without ?p=.
  window.renderFrame = (i, total) => {
    if (!Number.isFinite(i) || !Number.isInteger(total) || total < 1)
      throw new RangeError('renderFrame needs a finite frame index and a positive integer total');
    stop();
    frozen = true;
    phase = normalize(i / total);
    draw(phase);
  };

  function tick(now) {
    frameId = null;
    if (reduced.matches || frozen) return;
    const dt = last === null ? 0 : Math.min((now - last) / 1000, 0.1);
    last = now;
    if (!document.hidden) {
      phase = normalize(phase + dt / DURATION);
      draw(phase);
      window.__info.frames++;
    }
    frameId = requestAnimationFrame(tick);
  }
  function start() {
    if (!reduced.matches && !frozen && frameId === null)
      frameId = requestAnimationFrame(tick);
  }
  resize();
  draw(phase);
  addEventListener('resize', () => { resize(); draw(phase); });
  reduced.addEventListener('change', () => {
    stop();
    draw(phase);
    start();
  });
  addEventListener('keydown', event => {
    if (event.code !== 'Space' || q.has('p') || reduced.matches) return;
    event.preventDefault();
    frozen = !frozen;
    stop();
    start();
  });
  // A reduced-motion preference or a requested phase draws one still, with no RAF.
  if (reduced.matches || q.has('p')) return;
  start();
})();
</script>
</body>
</html>
