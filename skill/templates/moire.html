<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="motion-system" content="moire">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moire</title>
<!-- Loop method: Two fixed ring sheets overlap inside a disc. One sheet is still;
     the other moves five units around a closed phase circle without accumulating offsets.
     Query: ?seed=N, ?p=0..1 for a still, ?t=seconds (default 16).
     Palette: ?bg=RRGGBB&ink=RRGGBB&accent=RRGGBB. Space pauses. -->
<style>
  :root { --bg: #eee9df; --ink: #283b3c; --accent: #57736d; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Two fine ring patterns forming slowly shifting interference bands"></canvas>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const parsedSeed = Number.parseInt(q.get('seed') ?? '1', 10);
  const seed = Number.isFinite(parsedSeed) ? parsedSeed >>> 0 : 1;
  const parsedDuration = Number.parseFloat(q.get('t') ?? '16');
  const DURATION = Number.isFinite(parsedDuration) && parsedDuration > 0 ? parsedDuration : 16;
  for (const key of ['bg', 'ink', 'accent'])
    if (/^(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(q.get(key) ?? ''))
      document.documentElement.style.setProperty('--' + key, '#' + q.get(key));
  function mulberry32(a) {
    return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  const rng = mulberry32(seed);
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const css = name => getComputedStyle(cv).getPropertyValue(name).trim();
  const TAU = Math.PI * 2;
  const pitch = 11.5 + rng() * 2.2;
  const turn = (rng() - 0.5) * 1.3;
  const distance = 55 + rng() * 65, eccentricity = 0.79 + rng() * 0.2;
  const origin = rng() * pitch, motionOffset = rng() * TAU;
  const rings = new Path2D();
  // Both printed sheets retain identical geometry. Only the upper sheet translates.
  for (let r = pitch + origin; r < 1250; r += pitch) {
    rings.moveTo(r, 0); rings.arc(0, 0, r, 0, TAU);
  }
  let k, cx, cy;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(cv.clientWidth * dpr); cv.height = Math.round(cv.clientHeight * dpr);
    k = Math.min(cv.width / 1050, cv.height / 880);
    cx = cv.width / 2; cy = cv.height / 2;
  }
  function draw(p) {
    const theta = TAU * p;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = css('--bg'); ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.save();
    ctx.translate(cx, cy); ctx.scale(k, k);
    ctx.beginPath(); ctx.arc(0, 0, 350, 0, TAU); ctx.clip();
    ctx.rotate(turn);
    ctx.lineWidth = pitch * 0.42;
    ctx.strokeStyle = css('--ink');
    ctx.save(); ctx.translate(-distance, -20); ctx.scale(1, eccentricity);
    ctx.stroke(rings); ctx.restore();
    ctx.globalAlpha = 0.74;
    ctx.translate(distance + 5 * Math.cos(theta + motionOffset), 20 + 5 * Math.sin(theta + motionOffset));
    ctx.scale(1, eccentricity);
    ctx.strokeStyle = css('--accent'); ctx.stroke(rings);
    ctx.restore();
  }

  const normalize = p => ((p % 1) + 1) % 1;
  const requestedPhase = Number.parseFloat(q.get('p') ?? '0');
  let phase = Number.isFinite(requestedPhase) ? normalize(requestedPhase) : 0;
  let frozen = q.has('p'), frameId = null, last = null;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  window.__info = { seed, duration: DURATION, frames: 0 };

  function stop() {
    if (frameId !== null) cancelAnimationFrame(frameId);
    frameId = null;
    last = null;
  }
  // Rendering an export frame stops playback, including if called without ?p=.
  window.renderFrame = (i, total) => {
    if (!Number.isFinite(i) || !Number.isInteger(total) || total < 1)
      throw new RangeError('renderFrame needs a finite frame index and a positive integer total');
    stop();
    frozen = true;
    phase = normalize(i / total);
    draw(phase);
  };

  function tick(now) {
    frameId = null;
    if (reduced.matches || frozen) return;
    const dt = last === null ? 0 : Math.min((now - last) / 1000, 0.1);
    last = now;
    if (!document.hidden) {
      phase = normalize(phase + dt / DURATION);
      draw(phase);
      window.__info.frames++;
    }
    frameId = requestAnimationFrame(tick);
  }
  function start() {
    if (!reduced.matches && !frozen && frameId === null)
      frameId = requestAnimationFrame(tick);
  }
  resize();
  draw(phase);
  addEventListener('resize', () => { resize(); draw(phase); });
  reduced.addEventListener('change', () => {
    stop();
    draw(phase);
    start();
  });
  addEventListener('keydown', event => {
    if (event.code !== 'Space' || q.has('p') || reduced.matches) return;
    event.preventDefault();
    frozen = !frozen;
    stop();
    start();
  });
  // A reduced-motion preference or a requested phase draws one still, with no RAF.
  if (reduced.matches || q.has('p')) return;
  start();
})();
</script>
</body>
</html>
