<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="motion-system" content="clifford">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clifford attractor clip</title>
<!-- Motion template. Query: ?seed=N (default 1), ?t=seconds (default 4), ?p=0..1 for a still.
     Optional palette: ?bg=RRGGBB&ink=RRGGBB&accent=RRGGBB. Space pauses playback.
     Inline code only. Each frame is computed from its seed and loop phase. -->
<style>
  :root {
    /* Default colours; query parameters can replace these swatches. */
    --bg: #0e0f13;
    --ink: #e9e4d8;
    --accent: #e0673a;
    --points: 450000;      /* iterations per frame: density vs speed */
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Animated attractor"></canvas>
<script>
(() => {
  let W = 1, H = 1;
  const q = new URLSearchParams(location.search);
  const parsedSeed = Number.parseInt(q.get('seed') ?? '1', 10);
  const seed = Number.isFinite(parsedSeed) ? parsedSeed >>> 0 : 1;
  const parsedDuration = Number.parseFloat(q.get('t') ?? '4');
  const DURATION = Number.isFinite(parsedDuration) && parsedDuration > 0 ? parsedDuration : 4;
  for (const k of ['bg', 'ink', 'accent'])
    if (/^(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(q.get(k) ?? ''))
      document.documentElement.style.setProperty('--' + k, '#' + q.get(k));
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  function mulberry32(a) {
    return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  const tmp = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
  tmp.canvas.width = tmp.canvas.height = 1;
  const rgb = c => { tmp.clearRect(0, 0, 1, 1); tmp.fillStyle = '#000'; tmp.fillStyle = c; tmp.fillRect(0, 0, 1, 1);
    const d = tmp.getImageData(0, 0, 1, 1).data; return [d[0], d[1], d[2]]; };

  // base parameters: seeded search for a non-degenerate Clifford set (spread test on a 64x64 grid)
  const r = mulberry32(seed * 104729 + 7);
  let base, bx = 2, by = 2;
  for (let tries = 0; tries < 400; tries++) {
    const c = [-2 + r() * 4, -2 + r() * 4, -1.5 + r() * 3, -1.5 + r() * 3];
    let x = 0.1, y = 0.1, lo = [1e9, 1e9], hi = [-1e9, -1e9]; const cells = new Set();
    for (let i = 0; i < 30000; i++) {
      const nx = Math.sin(c[0] * y) + c[2] * Math.cos(c[0] * x), ny = Math.sin(c[1] * x) + c[3] * Math.cos(c[1] * y);
      x = nx; y = ny; if (i < 100) continue;
      lo = [Math.min(lo[0], x), Math.min(lo[1], y)]; hi = [Math.max(hi[0], x), Math.max(hi[1], y)];
      cells.add(((x + 4) * 8 | 0) * 100 + ((y + 4) * 8 | 0));
    }
    if (cells.size > 350 && hi[0] - lo[0] > 1.5 && hi[1] - lo[1] > 1.5) { base = c; bx = Math.max(-lo[0], hi[0]); by = Math.max(-lo[1], hi[1]); break; }
  }
  base = base || [-1.26, 1.77, 1.11, 0.56];           // bounded fallback parameters
  const amp = 0.03 + r() * 0.04, ph = [r(), r(), r(), r()].map(v => v * 6.283);
  const x0 = 0.1, y0 = 0.1;

  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let img, buf;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.width = Math.max(1, Math.round(cv.clientWidth * dpr));
    H = cv.height = Math.max(1, Math.round(cv.clientHeight * dpr));
    img = ctx.createImageData(W, H);
    buf = new Uint32Array(W * H);
  }

  function draw(p) {
    const th = p * Math.PI * 2;                           // periodic: parameters ride a circle
    const a = base[0] + amp * Math.sin(th + ph[0]), b = base[1] + amp * Math.sin(th + ph[1]),
          c = base[2] + amp * Math.cos(th + ph[2]), d = base[3] + amp * Math.cos(th + ph[3]);
    const N = Math.max(1000, Math.min(2000000, parseInt(css('--points'), 10) || 450000)), S = Math.min(W * 0.46 / bx, H * 0.46 / by);
    buf.fill(0);
    let x = x0, y = y0, max = 1;
    for (let i = 0; i < N; i++) {
      const nx = Math.sin(a * y) + c * Math.cos(a * x), ny = Math.sin(b * x) + d * Math.cos(b * y);
      x = nx; y = ny;
      if (i < 20) continue;
      const px = (W / 2 + x * S) | 0, py = (H / 2 + y * S) | 0;
      if (px >= 0 && px < W && py >= 0 && py < H) { const v = ++buf[py * W + px]; if (v > max) max = v; }
    }
    const bg = rgb(css('--bg')), ink = rgb(css('--ink')), ac = rgb(css('--accent'));
    const lm = Math.log(1 + max), o = img.data;
    for (let i = 0; i < buf.length; i++) {
      const v = buf[i], j = i * 4;
      if (!v) { o[j] = bg[0]; o[j + 1] = bg[1]; o[j + 2] = bg[2]; o[j + 3] = 255; continue; }
      const t = Math.pow(Math.log(1 + v) / lm, 0.8);      // tone map: bg -> ink -> accent
      const u = t < 0.6 ? t / 0.6 : (t - 0.6) / 0.4, A = t < 0.6 ? bg : ink, B = t < 0.6 ? ink : ac;
      o[j] = A[0] + (B[0] - A[0]) * u; o[j + 1] = A[1] + (B[1] - A[1]) * u; o[j + 2] = A[2] + (B[2] - A[2]) * u; o[j + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }

  const normalize = p => ((p % 1) + 1) % 1;
  const requestedPhase = Number.parseFloat(q.get('p') ?? '0');
  let phase = Number.isFinite(requestedPhase) ? normalize(requestedPhase) : 0;
  let frozen = q.has('p'), frameId = null, last = null;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  window.__info = { seed, duration: DURATION, frames: 0 };

  function stop() {
    if (frameId !== null) cancelAnimationFrame(frameId);
    frameId = null;
    last = null;
  }
  // Rendering an export frame stops playback, including if called without ?p=.
  window.renderFrame = (i, total) => {
    if (!Number.isFinite(i) || !Number.isInteger(total) || total < 1)
      throw new RangeError('renderFrame needs a finite frame index and a positive integer total');
    stop();
    frozen = true;
    phase = normalize(i / total);
    draw(phase);
  };

  function tick(now) {
    frameId = null;
    if (reduced.matches || frozen) return;
    const dt = last === null ? 0 : Math.min((now - last) / 1000, 0.1);
    last = now;
    if (!document.hidden) {
      phase = normalize(phase + dt / DURATION);
      draw(phase);
      window.__info.frames++;
    }
    frameId = requestAnimationFrame(tick);
  }
  function start() {
    if (!reduced.matches && !frozen && frameId === null)
      frameId = requestAnimationFrame(tick);
  }
  resize();
  draw(phase);
  addEventListener('resize', () => { resize(); draw(phase); });
  reduced.addEventListener('change', () => {
    stop();
    draw(phase);
    start();
  });
  addEventListener('keydown', event => {
    if (event.code !== 'Space' || q.has('p') || reduced.matches) return;
    event.preventDefault();
    frozen = !frozen;
    stop();
    start();
  });
  // A reduced-motion preference or a requested phase draws one still, with no RAF.
  if (reduced.matches || q.has('p')) return;
  start();
})();
</script>
</body>
</html>
