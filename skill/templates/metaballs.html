<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="motion-system" content="metaballs">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metaballs</title>
<!-- Loop method: Three seeded inverse-square field centres follow closed sine/cosine paths.
     The fixed level set is shaded from its analytic field gradient; there is no feedback.
     Query: ?seed=N, ?p=0..1 for a still, ?t=seconds (default 16).
     Palette: ?bg=RRGGBB&ink=RRGGBB&accent=RRGGBB. Space pauses. -->
<style>
  :root { --bg: #e9e6dc; --ink: #143b37; --accent: #b6ccbc; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Three glossy liquid masses merging on a quiet background"></canvas>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const parsedSeed = Number.parseInt(q.get('seed') ?? '1', 10);
  const seed = Number.isFinite(parsedSeed) ? parsedSeed >>> 0 : 1;
  const parsedDuration = Number.parseFloat(q.get('t') ?? '16');
  const DURATION = Number.isFinite(parsedDuration) && parsedDuration > 0 ? parsedDuration : 16;
  for (const key of ['bg', 'ink', 'accent'])
    if (/^(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(q.get(key) ?? ''))
      document.documentElement.style.setProperty('--' + key, '#' + q.get(key));
  function mulberry32(a) {
    return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  const rng = mulberry32(seed);
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const css = name => getComputedStyle(cv).getPropertyValue(name).trim();
  const TAU = Math.PI * 2;
  const offset = rng() * TAU, tilt = (rng() - 0.5) * 0.9;
  // Three inverse-square fields. Radii and threshold stay fixed for the whole loop.
  const balls = Array.from({ length: 3 }, (_, i) => ({
    angle: offset + i * TAU / 3, radius: 126 + rng() * 24,
    orbit: 162 + rng() * 36, sway: 24 + rng() * 22, phase: rng() * TAU
  }));
  const surface = document.createElement('canvas'), paint = surface.getContext('2d');
  const swatch = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
  swatch.canvas.width = swatch.canvas.height = 1;
  function rgb(color) {
    swatch.clearRect(0, 0, 1, 1); swatch.fillStyle = color; swatch.fillRect(0, 0, 1, 1);
    return Array.from(swatch.getImageData(0, 0, 1, 1).data).slice(0, 3);
  }
  let pixels, background, xs, ys, bg, ink, accent, fit;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(cv.clientWidth * dpr); cv.height = Math.round(cv.clientHeight * dpr);
    // Fixed upper sampling budget: soft liquid edges, independent of playback history.
    const scale = Math.min(1, 576 / cv.width, 432 / cv.height);
    surface.width = Math.max(1, Math.round(cv.width * scale));
    surface.height = Math.max(1, Math.round(cv.height * scale));
    pixels = paint.createImageData(surface.width, surface.height);
    fit = Math.min(surface.width / 1120, surface.height / 820);
    xs = Float32Array.from({ length: surface.width }, (_, x) => (x + 0.5 - surface.width / 2) / fit);
    ys = Float32Array.from({ length: surface.height }, (_, y) => (y + 0.5 - surface.height / 2) / fit);
    bg = rgb(css('--bg')); ink = rgb(css('--ink')); accent = rgb(css('--accent'));
    background = new Uint8ClampedArray(pixels.data.length);
    for (let i = 0; i < background.length; i += 4) {
      background[i] = bg[0]; background[i + 1] = bg[1]; background[i + 2] = bg[2]; background[i + 3] = 255;
    }
  }
  function draw(p) {
    const theta = p * TAU, co = Math.cos(tilt), si = Math.sin(tilt);
    const centers = balls.map(b => {
      const a = b.angle + 0.22 * Math.sin(theta + b.phase);
      const x = Math.cos(a) * (b.orbit + b.sway * Math.sin(theta + b.phase));
      const y = Math.sin(a) * (b.orbit + b.sway * Math.cos(theta + b.phase));
      return [x * co - y * si, x * si + y * co, b.radius * b.radius];
    });
    const data = pixels.data;
    data.set(background);
    // Outside this conservative bound the summed field is below the visible threshold.
    const reach = Math.sqrt(centers.reduce((sum, b) => sum + b[2], 0) / 0.98);
    const left = Math.max(0, Math.floor((Math.min(...centers.map(b => b[0])) - reach) * fit + xs.length / 2));
    const right = Math.min(xs.length, Math.ceil((Math.max(...centers.map(b => b[0])) + reach) * fit + xs.length / 2));
    const top = Math.max(0, Math.floor((Math.min(...centers.map(b => b[1])) - reach) * fit + ys.length / 2));
    const bottom = Math.min(ys.length, Math.ceil((Math.max(...centers.map(b => b[1])) + reach) * fit + ys.length / 2));
    for (let y = top; y < bottom; y++) {
      let index = (y * xs.length + left) * 4;
      for (let x = left; x < right; x++, index += 4) {
        let field = 0, gx = 0, gy = 0;
        for (let j = 0; j < 3; j++) {
          const b = centers[j], dx = xs[x] - b[0], dy = ys[y] - b[1];
          const inverse = 1 / (dx * dx + dy * dy + 0.001), f = b[2] * inverse;
          field += f; gx -= 2 * f * dx * inverse; gy -= 2 * f * dy * inverse;
        }
        let coverage = Math.max(0, Math.min(1, (field - 0.98) / 0.04));
        coverage = coverage * coverage * (3 - 2 * coverage);
        let red = bg[0], green = bg[1], blue = bg[2];
        if (coverage > 0) {
          // An analytic height over the level set gives a broad, liquid highlight.
          const height = Math.sqrt(Math.max(0.002, 1 - 1 / Math.max(1.002, field)));
          const slope = -135 / (2 * height * field * field);
          const nx = gx * slope, ny = gy * slope, length = Math.sqrt(nx * nx + ny * ny + 1);
          const diffuse = Math.max(0, (-0.42 * nx - 0.54 * ny + 0.73) / length);
          const specular = Math.pow(Math.max(0, (-0.23 * nx - 0.29 * ny + 0.929) / length), 36);
          const tone = 0.12 + 0.61 * diffuse;
          const shine = 0.62 * specular;
          red += coverage * (ink[0] + (accent[0] - ink[0]) * tone + (255 - accent[0]) * shine - red);
          green += coverage * (ink[1] + (accent[1] - ink[1]) * tone + (255 - accent[1]) * shine - green);
          blue += coverage * (ink[2] + (accent[2] - ink[2]) * tone + (255 - accent[2]) * shine - blue);
        }
        data[index] = red; data[index + 1] = green; data[index + 2] = blue; data[index + 3] = 255;
      }
    }
    paint.putImageData(pixels, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(surface, 0, 0, cv.width, cv.height);
  }

  const normalize = p => ((p % 1) + 1) % 1;
  const requestedPhase = Number.parseFloat(q.get('p') ?? '0');
  let phase = Number.isFinite(requestedPhase) ? normalize(requestedPhase) : 0;
  let frozen = q.has('p'), frameId = null, last = null;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  window.__info = { seed, duration: DURATION, frames: 0 };

  function stop() {
    if (frameId !== null) cancelAnimationFrame(frameId);
    frameId = null;
    last = null;
  }
  // Rendering an export frame stops playback, including if called without ?p=.
  window.renderFrame = (i, total) => {
    if (!Number.isFinite(i) || !Number.isInteger(total) || total < 1)
      throw new RangeError('renderFrame needs a finite frame index and a positive integer total');
    stop();
    frozen = true;
    phase = normalize(i / total);
    draw(phase);
  };

  function tick(now) {
    frameId = null;
    if (reduced.matches || frozen) return;
    const dt = last === null ? 0 : Math.min((now - last) / 1000, 0.1);
    last = now;
    if (!document.hidden) {
      phase = normalize(phase + dt / DURATION);
      draw(phase);
      window.__info.frames++;
    }
    frameId = requestAnimationFrame(tick);
  }
  function start() {
    if (!reduced.matches && !frozen && frameId === null)
      frameId = requestAnimationFrame(tick);
  }
  resize();
  draw(phase);
  addEventListener('resize', () => { resize(); draw(phase); });
  reduced.addEventListener('change', () => {
    stop();
    draw(phase);
    start();
  });
  addEventListener('keydown', event => {
    if (event.code !== 'Space' || q.has('p') || reduced.matches) return;
    event.preventDefault();
    frozen = !frozen;
    stop();
    start();
  });
  // A reduced-motion preference or a requested phase draws one still, with no RAF.
  if (reduced.matches || q.has('p')) return;
  start();
})();
</script>
</body>
</html>
