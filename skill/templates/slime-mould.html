<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="motion-system" content="slime-mould">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slime mould</title>
<!-- Loop: freeze the trail field after 320 seeded sensing and diffusion steps.
     Animate only a bounded periodic sampling warp; never deposit while rendering.
     Simulation and sampling both use toroidal boundaries.
     Query: ?seed=N, ?p=0..1 for a still, ?t=seconds (default 18).
     Optional palette: ?bg=RRGGBB&ink=RRGGBB&accent=RRGGBB. Space pauses. -->
<style>
  :root { --bg: #0b181b; --ink: #e4e3b8; --accent: #628f82; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Luminous branching slime mould transport trails on deep green"></canvas>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const parsedSeed = Number.parseInt(q.get('seed') ?? '1', 10);
  const seed = Number.isFinite(parsedSeed) ? parsedSeed >>> 0 : 1;
  const parsedDuration = Number.parseFloat(q.get('t') ?? '18');
  const DURATION = Number.isFinite(parsedDuration) && parsedDuration > 0 ? parsedDuration : 18;
  for (const k of ['bg', 'ink', 'accent'])
    if (/^(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(q.get(k) ?? ''))
      document.documentElement.style.setProperty('--' + k, '#' + q.get(k));
  function mulberry32(a) {
    return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  const rng = mulberry32(seed), TAU = Math.PI * 2;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d', { alpha: false });

  // Agents sense three directions, turn toward trails, deposit, diffuse and decay.
  // A torus gives the simulation and the later sampling warp the same boundary.
  const NX = 560, NY = 360, N = NX * NY, AGENTS = 9600;
  let trail = new Float32Array(N), blurred = new Float32Array(N);
  const px = new Float32Array(AGENTS), py = new Float32Array(AGENTS);
  const heading = new Float32Array(AGENTS);
  for (let i = 0; i < AGENTS; i++) {
    px[i] = rng() * NX;
    py[i] = rng() * NY;
    heading[i] = rng() * TAU;
  }
  const turn = 0.34 + rng() * 0.1, sensorAngle = 0.58, sensorDistance = 6;
  function sense(x, y, angle) {
    const sx = Math.floor(x + Math.cos(angle) * sensorDistance + NX) % NX;
    const sy = Math.floor(y + Math.sin(angle) * sensorDistance + NY) % NY;
    return trail[sy * NX + sx];
  }
  for (let step = 0; step < 320; step++) {
    for (let i = 0; i < AGENTS; i++) {
      const x = px[i], y = py[i], angle = heading[i];
      const front = sense(x, y, angle), left = sense(x, y, angle - sensorAngle), right = sense(x, y, angle + sensorAngle);
      let next = angle;
      if (front < left || front < right) {
        if (front < left && front < right) next += (rng() < 0.5 ? -turn : turn);
        else if (left > right) next -= turn;
        else if (right > left) next += turn;
      }
      heading[i] = next;
      px[i] = (x + Math.cos(next) * 1.1 + NX) % NX;
      py[i] = (y + Math.sin(next) * 1.1 + NY) % NY;
      trail[Math.floor(py[i]) * NX + Math.floor(px[i])] += 1.4;
    }
    for (let y = 0; y < NY; y++) {
      const row = y * NX, up = ((y + NY - 1) % NY) * NX, down = ((y + 1) % NY) * NX;
      for (let x = 0; x < NX; x++) {
        const l = (x + NX - 1) % NX, r = (x + 1) % NX, i = row + x;
        blurred[i] = (trail[i] * 4 + trail[row + l] + trail[row + r] + trail[up + x] + trail[down + x]) * 0.119;
      }
    }
    [trail, blurred] = [blurred, trail];
  }
  const field = trail;
  let peak = 0;
  for (let i = 0; i < N; i++) peak = Math.max(peak, field[i]);
  const exposure = 1 / Math.log1p(peak * 0.65);
  for (let i = 0; i < N; i++) field[i] = Math.min(1, Math.log1p(field[i] * 0.65) * exposure);

  // Render a modest field texture, then let canvas scale it to the backing store.
  // Separable smooth warps need only one sine per row/column, not per pixel.
  const layer = document.createElement('canvas');
  layer.width = 420; layer.height = 280;
  const paint = layer.getContext('2d', { alpha: false });
  const pixels = paint.createImageData(layer.width, layer.height);
  const colours = new Uint8ClampedArray(1024 * 3);
  const paletteProbe = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
  paletteProbe.canvas.width = paletteProbe.canvas.height = 1;
  let paletteKey = '';
  function colour(value) {
    paletteProbe.clearRect(0, 0, 1, 1); paletteProbe.fillStyle = value;
    paletteProbe.fillRect(0, 0, 1, 1);
    return paletteProbe.getImageData(0, 0, 1, 1).data;
  }
  function updatePalette() {
    const style = getComputedStyle(cv);
    const values = ['--bg', '--ink', '--accent'].map(k => style.getPropertyValue(k).trim());
    const key = values.join('|');
    if (key === paletteKey) return;
    paletteKey = key;
    const [bg, ink, accent] = values.map(colour);
    for (let i = 0; i < 1024; i++) {
      const v = i / 1023;
      const t = Math.max(0, Math.min(1, (v - 0.04) / 0.84));
      const u = t * t * (3 - 2 * t);
      const a = u < 0.65 ? bg : accent, b = u < 0.65 ? accent : ink;
      const mix = u < 0.65 ? u / 0.65 : (u - 0.65) / 0.35;
      for (let channel = 0; channel < 3; channel++) colours[i * 3 + channel] = a[channel] + (b[channel] - a[channel]) * mix;
    }
  }
  const warpX = new Float32Array(layer.height), warpY = new Float32Array(layer.width);
  const offsetX = rng() * TAU, offsetY = rng() * TAU;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(cv.clientWidth * dpr));
    cv.height = Math.max(1, Math.round(cv.clientHeight * dpr));
  }
  function draw(p) {
    updatePalette();
    const angle = p * TAU, width = layer.width, height = layer.height;
    for (let y = 0; y < height; y++) warpX[y] = 2.6 * Math.sin(angle + y / height * TAU + offsetX);
    for (let x = 0; x < width; x++) warpY[x] = 1.8 * Math.cos(angle + x / width * TAU + offsetY);
    const data = pixels.data;
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        // Explicit toroidal bilinear sampling, including both edge neighbours.
        let sx = x / width * NX + warpX[y], sy = y / height * NY + warpY[x];
        if (sx < 0) sx += NX; else if (sx >= NX) sx -= NX;
        if (sy < 0) sy += NY; else if (sy >= NY) sy -= NY;
        const ix = Math.floor(sx), iy = Math.floor(sy), fx = sx - ix, fy = sy - iy;
        const jx = (ix + 1) % NX, jy = (iy + 1) % NY;
        const top = field[iy * NX + ix] * (1 - fx) + field[iy * NX + jx] * fx;
        const bottom = field[jy * NX + ix] * (1 - fx) + field[jy * NX + jx] * fx;
        const value = top * (1 - fy) + bottom * fy;
        const ci = Math.round(value * 1023) * 3;
        const out = (y * width + x) * 4;
        data[out] = colours[ci]; data[out + 1] = colours[ci + 1]; data[out + 2] = colours[ci + 2]; data[out + 3] = 255;
      }
    }
    paint.putImageData(pixels, 0, 0);
    const scale = Math.max(cv.width / width, cv.height / height);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'low';
    ctx.drawImage(layer, (cv.width - width * scale) / 2, (cv.height - height * scale) / 2, width * scale, height * scale);
  }

  const normalize = p => ((p % 1) + 1) % 1;
  const requestedPhase = Number.parseFloat(q.get('p') ?? '0');
  let phase = Number.isFinite(requestedPhase) ? normalize(requestedPhase) : 0;
  let exported = false;
  let frozen = q.has('p'), frameId = null, last = null;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  window.__info = { seed, duration: DURATION, frames: 0 };

  function stop() {
    if (frameId !== null) cancelAnimationFrame(frameId);
    frameId = null;
    last = null;
  }
  // Rendering an export frame stops playback, including if called without ?p=.
  window.renderFrame = (i, total) => {
    if (!Number.isFinite(i) || !Number.isInteger(total) || total < 1)
      throw new RangeError('renderFrame needs a finite frame index and a positive integer total');
    stop();
    frozen = true;
    exported = true;
    phase = normalize(i / total);
    draw(phase);
  };

  function tick(now) {
    frameId = null;
    if (reduced.matches || frozen) return;
    const dt = last === null ? 0 : Math.min((now - last) / 1000, 0.1);
    last = now;
    if (!document.hidden) {
      phase = normalize(phase + dt / DURATION);
      draw(phase);
      window.__info.frames++;
    }
    frameId = requestAnimationFrame(tick);
  }
  function start() {
    if (!document.hidden && !reduced.matches && !frozen && frameId === null)
      frameId = requestAnimationFrame(tick);
  }
  document.addEventListener('visibilitychange', () => { stop(); if (!document.hidden) { draw(phase); start(); } });
  resize();
  draw(phase);
  addEventListener('resize', () => { resize(); if (!document.hidden) draw(phase); });
  reduced.addEventListener('change', () => {
    stop();
    if (!document.hidden) draw(phase);
    start();
  });
  addEventListener('keydown', event => {
    if (event.code !== 'Space' || event.repeat || exported || q.has('p') || reduced.matches) return;
    event.preventDefault();
    frozen = !frozen;
    stop();
    start();
  });
  // A reduced-motion preference or a requested phase draws one still, with no RAF.
  if (reduced.matches || q.has('p')) return;
  start();
})();
</script>
</body>
</html>
